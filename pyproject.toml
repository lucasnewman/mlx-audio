[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-audio"
dynamic = ["version"]
description = "MLX-Audio is a package for inference of text-to-speech (TTS) and speech-to-speech (STS) models locally on your Mac using MLX"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Prince Canuma", email = "prince.gdt@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"

# Core dependencies
dependencies = [
    # Security floors for the shared HTTP and Hugging Face dependency stack.
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "huggingface_hub>=1.0",
    "jinja2>=3.1.6",
    "miniaudio>=1.71",
    "mlx>=0.32.4",
    "numpy>=1.26.4",
    "requests>=2.33.0",
    "scipy>=1.10.0",
    "sentencepiece>=0.2.0",
    "sounddevice>=0.5.3",
    "tqdm>=4.67.1",
    "transformers[chat-template]>=5.14.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
# STT dependencies
stt = [
    "zstandard>=0.23.0",
]

# TTS dependencies
tts = [
    "mistral-common[audio]",
    "pillow>=13.0.0",
]

# Server dependencies
server = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.31",
    # Provides the same webrtcvad import without depending on pkg_resources.
    "webrtcvad-wheels>=2.0.14.post1",
]

# STS (Speech-to-Speech) dependencies
sts = [
    # The speech-to-speech pipeline's default responder loads an arbitrary chat
    # model, which is mlx-lm's job; every other use is vendored in mlx_audio/lm.
    "mlx-lm>=0.31.1",

    "webrtcvad-wheels>=2.0.14.post1",
]

# Full installation (all features)
all = [
    "mistral-common[audio]",
    "pillow>=13.0.0",
    "zstandard>=0.23.0",

    "mlx-lm>=0.31.1",

    "fastapi>=0.95.0",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.22.0",

    "webrtcvad-wheels>=2.0.14.post1",
]

# Optional in-process LLM responder for the speech-to-speech pipeline. Every
# other mlx-lm use is vendored under mlx_audio/lm.
llm = [
    "mlx-lm>=0.31.1",
]

# Differential tests against the pinned mlx-lm reference.
parity = [
    "mlx-lm==0.32.2; python_version >= '3.11'",
]

# Development dependencies
dev = [
    "httpx2>=2.0.0,<3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "black>=26.10.1",
    "isort>=5.13.2",
    "pre-commit>=3.7.0",
    "pygments>=2.20.0",
    "virtualenv>=21.15.6",
]

# Documentation dependencies
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "pygments>=2.20.0",
    "pymdown-extensions>=11.0.1",
]

[project.scripts]
"mlx_audio.convert" = "mlx_audio.convert:main"
"mlx_audio.stt.generate" = "mlx_audio.stt.generate:main"
"mlx_audio.tts.generate" = "mlx_audio.tts.generate:main"
"mlx_audio.music.generate" = "mlx_audio.music.generate:main"
"mlx_audio.server" = "mlx_audio.server:main"
"mlx_audio.sts.generate" = "mlx_audio.sts.generate:main"
"mlx_audio.sts.live" = "mlx_audio.sts.live:main"

[project.urls]
Homepage = "https://www.neywalabs.ai"
Repository = "https://github.com/Blaizzy/mlx-audio"

[tool.poetry]
version = "0.0.0"

[tool.setuptools.dynamic]
version = {attr = "mlx_audio.version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mlx_audio", "mlx_audio.*"]

[tool.setuptools.package-data]
mlx_audio = [
    "tts/*.html",
    "tts/*.js",
    "tts/*.css",
    "tts/**/*.json",
    "tts/static/**/*",
]
"mlx_audio.sts.models.nemotron_reuse" = ["README.md"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
